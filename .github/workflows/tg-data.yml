name: tg-data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Скачать данные канала
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python scripts/fetch_tg.py

      - name: Закоммитить, если что-то изменилось
        run: |
          git config user.name "tg-data-bot"
          git config user.email "tg-data-bot@users.noreply.github.com"
          git add -A tg-data
          if git diff --cached --quiet; then
            echo "без изменений"
          else
            git commit -m "tg-data: обновление"
            git pull --rebase --autostash
            git push
          fi
